<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#091a24"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Blobs -->
  <circle cx="180" cy="110" r="140" fill="#06b6d4" opacity="0.10" filter="url(#glow)"/>
  <circle cx="790" cy="480" r="170" fill="#10b981" opacity="0.10" filter="url(#glow)"/>

  <!-- Main IDE Window -->
  <rect x="44" y="38" width="872" height="524" rx="18" fill="#0d1526" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Bar -->
  <rect x="44" y="38" width="872" height="48" rx="18" fill="#111c33"/>
  <rect x="44" y="68" width="872" height="18" fill="#111c33"/>
  <line x1="44" y1="86" x2="916" y2="86" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="74" cy="62" r="6" fill="#ef4444"/>
  <circle cx="94" cy="62" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="62" r="6" fill="#10b981"/>

  <!-- Brand & File Tab -->
  <rect x="142" y="48" width="110" height="28" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.4"/>
  <text x="160" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#22d3ee">CodeJ IDE</text>

  <rect x="266" y="48" width="136" height="28" rx="8" fill="#1e293b"/>
  <text x="282" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2e8f0">BinarySearch.java</text>

  <!-- Top Right Action Badges -->
  <rect x="646" y="48" width="116" height="28" rx="8" fill="#064e3b" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="665" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#34d399">GitHub Sync</text>

  <rect x="774" y="48" width="122" height="28" rx="8" fill="url(#accentCyan)"/>
  <text x="794" y="66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#06121f">Run &amp; Analyze</text>

  <!-- Left Pane: Java Editor -->
  <rect x="64" y="104" width="496" height="318" rx="12" fill="#080e1a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="84" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">1</text>
  <text x="108" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c084fc">public class <tspan fill="#38bdf8">Solution</tspan> <tspan fill="#e2e8f0">{</tspan></text>

  <text x="84" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">2</text>
  <text x="124" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c084fc">public static int <tspan fill="#22d3ee">search</tspan><tspan fill="#e2e8f0">(int[] nums, int target) {</tspan></text>

  <text x="84" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">3</text>
  <text x="142" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e2e8f0">int left = <tspan fill="#fbbf24">0</tspan>, right = nums.length - <tspan fill="#fbbf24">1</tspan>;</text>

  <text x="84" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">4</text>
  <text x="142" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c084fc">while <tspan fill="#e2e8f0">(left &lt;= right) {</tspan></text>

  <text x="84" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">5</text>
  <text x="160" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e2e8f0">int mid = left + (right - left) / <tspan fill="#fbbf24">2</tspan>;</text>

  <text x="84" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">6</text>
  <text x="160" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c084fc">if <tspan fill="#e2e8f0">(nums[mid] == target) </tspan>return <tspan fill="#e2e8f0">mid;</tspan></text>

  <text x="84" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">7</text>
  <text x="160" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c084fc">if <tspan fill="#e2e8f0">(nums[mid] &lt; target) left = mid + </tspan><tspan fill="#fbbf24">1</tspan><tspan fill="#e2e8f0">;</tspan></text>

  <text x="84" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">8</text>
  <text x="160" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c084fc">else <tspan fill="#e2e8f0">right = mid - </tspan><tspan fill="#fbbf24">1</tspan><tspan fill="#e2e8f0">;</tspan></text>

  <text x="84" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">9</text>
  <text x="142" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e2e8f0">}</text>

  <text x="80" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">10</text>
  <text x="142" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c084fc">return <tspan fill="#fbbf24">-1</tspan><tspan fill="#e2e8f0">;</tspan></text>

  <text x="80" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">11</text>
  <text x="124" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e2e8f0">}</text>

  <!-- Bottom Left: Stdin & Compiler Output -->
  <rect x="64" y="436" width="496" height="106" rx="12" fill="#080e1a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="82" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#94a3b8">STDIN &amp; COMPILER OUTPUT</text>
  <rect x="82" y="472" width="460" height="54" rx="8" fill="#0f172a"/>
  <text x="96" y="494" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#34d399">&gt; javac Solution.java &amp;&amp; java Solution</text>
  <text x="96" y="514" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2e8f0">Target found at index: 4  |  Runtime: 12 ms</text>

  <!-- Right Pane: Gemini AI Tutor & Big-O Complexity -->
  <rect x="578" y="104" width="318" height="438" rx="12" fill="#0a1222" stroke="#1e293b" stroke-width="1.5"/>
  <text x="598" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#22d3ee">GEMINI AI TUTOR &amp; BIG-O</text>
  <line x1="598" y1="144" x2="876" y2="144" stroke="#1e293b" stroke-width="1"/>

  <!-- Big-O Cards -->
  <rect x="598" y="160" width="132" height="72" rx="10" fill="#111c33" stroke="#22d3ee" stroke-opacity="0.35"/>
  <text x="612" y="182" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">Time Complexity</text>
  <text x="612" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#22d3ee">O(log n)</text>

  <rect x="744" y="160" width="132" height="72" rx="10" fill="#111c33" stroke="#34d399" stroke-opacity="0.35"/>
  <text x="758" y="182" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">Space Complexity</text>
  <text x="758" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#34d399">O(1)</text>

  <!-- Visualization Graph -->
  <rect x="598" y="248" width="278" height="122" rx="10" fill="#080e1a" stroke="#1e293b"/>
  <text x="612" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94a3b8">ALGORITHM VISUALIZATION</text>
  <rect x="616" y="288" width="38" height="34" rx="6" fill="#1e293b"/>
  <text x="631" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94a3b8">2</text>
  <rect x="662" y="288" width="38" height="34" rx="6" fill="#1e293b"/>
  <text x="677" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94a3b8">5</text>
  <rect x="708" y="288" width="38" height="34" rx="6" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="723" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff">9</text>
  <rect x="754" y="288" width="38" height="34" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="765" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff">14</text>
  <rect x="800" y="288" width="38" height="34" rx="6" fill="#1e293b"/>
  <text x="811" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94a3b8">21</text>
  <text x="716" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#22d3ee">MID</text>
  <text x="755" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#34d399">MATCH</text>

  <!-- AI Breakdown Card -->
  <rect x="598" y="384" width="278" height="140" rx="10" fill="#111c33" stroke="#8b5cf6" stroke-opacity="0.35"/>
  <text x="614" y="408" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">AI Logic Breakdown</text>
  <text x="614" y="432" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">• Overflow-safe midpoint calculation</text>
  <text x="614" y="454" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">• Halves search space each iteration</text>
  <text x="614" y="476" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">• Ready to push to GitHub repo</text>
  <rect x="614" y="492" width="128" height="22" rx="6" fill="url(#accentAmber)"/>
  <text x="625" y="507" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#0f172a">JAVA DSA PLAYGROUND</text>
</svg>
